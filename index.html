<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>科治新技 運輸課加班速記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="month"], input[type="date"], input[type="text"] {
      color-scheme: dark;
    }
    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      text-align: center;
    }
    /* 隱藏 details 預設的三角形 */
    details > summary::-webkit-details-marker {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen pb-24 select-none">

  <!-- 頂部導航 -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2.5">
      <div class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold text-lg">
        <i class="fa-solid fa-truck-moving"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
          科治新技
        </h1>
        <p class="text-[11px] text-slate-400" id="driverProfileLabel">本機專用（尚未設定司機）</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="openProfileModal()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 border border-slate-700 flex items-center gap-1">
        <i class="fa-solid fa-user-pen text-amber-400"></i>
        <span>身分設定</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-3.5 py-4 space-y-4">
    
    <!-- 總時數看板 (只保留最重要的大字) -->
    <div class="bg-gradient-to-br from-slate-800/90 to-slate-900/90 border border-slate-700/60 rounded-2xl p-5 shadow-xl text-center">
      <div class="flex items-center justify-between mb-4 border-b border-slate-700/50 pb-3">
        <span class="text-xs font-semibold text-slate-400 flex items-center gap-1.5">
          <i class="fa-solid fa-calendar-check text-amber-400"></i>
          <span>查詢月份</span>
        </span>
        <input type="month" id="monthSelector" onchange="onMonthChanged()" class="bg-slate-800 border border-slate-600 rounded-lg px-2 py-1 text-sm text-amber-400 font-bold focus:outline-none focus:border-amber-400">
      </div>
      
      <p class="text-xs text-slate-400 mb-1 font-bold">本月實際總加班 (在廠工時)</p>
      <div class="flex items-baseline justify-center space-x-2">
        <span class="text-[64px] font-black tracking-tight text-white leading-none" id="statTotalActualHours">0.0</span>
        <span class="text-lg font-bold text-slate-400">h</span>
      </div>
    </div>

    <!-- 折疊區 1：詳細統計與倍率對帳 -->
    <details class="group bg-slate-900 border border-slate-700 rounded-2xl shadow-lg overflow-hidden">
      <summary class="flex justify-between items-center font-bold cursor-pointer list-none p-4 text-sm text-amber-400 bg-slate-800/50 hover:bg-slate-800 transition">
        <span class="flex items-center gap-2"><i class="fa-solid fa-chart-pie"></i> 展開本月時數與倍率對帳</span>
        <span class="transition-transform duration-300 group-open:rotate-180"><i class="fa-solid fa-chevron-down"></i></span>
      </summary>
      
      <div class="p-4 border-t border-slate-700 space-y-5">
        <!-- 實際工時分類 -->
        <div>
          <h3 class="text-[11px] text-slate-400 font-bold mb-2 flex items-center gap-1"><i class="fa-regular fa-clock"></i> 實際工時分類</h3>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-slate-800/80 rounded-xl py-3 px-1 border border-slate-700">
              <span class="text-xs text-slate-400 block mb-1">平日總計</span>
              <span class="text-2xl font-black text-sky-400" id="statActWeekday">0.0</span><span class="text-xs text-slate-500 ml-0.5">h</span>
            </div>
            <div class="bg-slate-800/80 rounded-xl py-3 px-1 border border-slate-700">
              <span class="text-xs text-slate-400 block mb-1">假日總計</span>
              <span class="text-2xl font-black text-emerald-400" id="statActWeekend">0.0</span><span class="text-xs text-slate-500 ml-0.5">h</span>
            </div>
            <div class="bg-slate-800/80 rounded-xl py-3 px-1 border border-slate-700">
              <span class="text-xs text-slate-400 block mb-1">紅字總計</span>
              <span class="text-2xl font-black text-rose-400" id="statActHoliday">0.0</span><span class="text-xs text-slate-500 ml-0.5">h</span>
            </div>
          </div>
        </div>

        <!-- 倍率對帳分類 -->
        <div>
          <h3 class="text-[11px] text-amber-500/80 font-bold mb-2 flex items-center gap-1"><i class="fa-solid fa-calculator"></i> 勞基法倍率總和 (發薪對帳用)</h3>
          <div class="grid grid-cols-2 gap-2 text-center">
            <div class="bg-amber-900/10 rounded-xl py-3 px-1 border border-amber-700/30">
              <span class="text-xs text-amber-500/70 block mb-1 font-bold">1.33 倍</span>
              <span class="text-3xl font-black text-amber-400" id="statRate133">0.0</span><span class="text-xs text-amber-500/50 ml-1">h</span>
            </div>
            <div class="bg-amber-900/10 rounded-xl py-3 px-1 border border-amber-700/30">
              <span class="text-xs text-amber-500/70 block mb-1 font-bold">1.67 倍</span>
              <span class="text-3xl font-black text-amber-400" id="statRate167">0.0</span><span class="text-xs text-amber-500/50 ml-1">h</span>
            </div>
            <div class="bg-amber-900/10 rounded-xl py-3 px-1 border border-amber-700/30">
              <span class="text-xs text-amber-500/70 block mb-1 font-bold">2.67 倍</span>
              <span class="text-3xl font-black text-amber-400" id="statRate267">0.0</span><span class="text-xs text-amber-500/50 ml-1">h</span>
            </div>
            <div class="bg-rose-900/10 rounded-xl py-3 px-1 border border-rose-700/30">
              <span class="text-xs text-rose-400/80 block mb-1 font-bold">1.5 倍 (紅字)</span>
              <span class="text-3xl font-black text-rose-400" id="statRate15">0.0</span><span class="text-xs text-rose-500/50 ml-1">h</span>
            </div>
          </div>
        </div>
      </div>
    </details>

    <!-- 下班單次輸入卡片 -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <h2 class="text-sm font-bold text-slate-200 flex items-center gap-1.5">
          <i class="fa-solid fa-clock-rotate-left text-amber-400"></i> 下班打卡登記
        </h2>
        <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-amber-300 font-medium" id="weekdayNameDisplay">--</span>
      </div>

      <div class="grid grid-cols-12 gap-3 items-center border-b border-slate-800/50 pb-3">
        <div class="col-span-7">
          <label class="text-[11px] text-slate-400 block mb-1 font-medium">日期</label>
          <input type="date" id="inputDate" onchange="onDateChanged()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
        <div class="col-span-5">
          <label class="text-[11px] text-slate-400 block mb-1 font-medium">系統判定</label>
          <div id="autoTypeBadge" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-sm text-center font-bold text-slate-300">--</div>
        </div>
        <div class="col-span-12 flex justify-end">
          <label class="flex items-center space-x-2 text-xs text-slate-400 bg-slate-800/50 px-2 py-1 rounded-lg border border-slate-700">
            <input type="checkbox" id="isHolidayCheck" onchange="calculatePreview()" class="w-3.5 h-3.5 accent-rose-500">
            <span>強制標記為國定紅字 (全天1.5)</span>
          </label>
        </div>
      </div>

      <div class="bg-slate-800/40 rounded-xl p-3 border border-slate-800 space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-slate-300">上班出勤時間</label>
          <span class="text-[11px] text-amber-400 flex items-center gap-1"><i class="fa-solid fa-rotate"></i> 自動記憶</span>
        </div>
        <div class="flex items-center space-x-2 bg-slate-900 rounded-xl p-1 border border-slate-700">
          <button type="button" onclick="stepTime('inputStartTime', -1)" class="w-14 h-11 flex items-center justify-center rounded-lg bg-slate-800 text-slate-300 hover:text-white active:bg-slate-700 text-sm font-bold border border-slate-700 shadow-sm"><i class="fa-solid fa-minus mr-1"></i>30分</button>
          <select id="inputStartTime" onchange="calculatePreview()" class="flex-1 bg-transparent text-2xl font-black text-white text-center focus:outline-none"></select>
          <button type="button" onclick="stepTime('inputStartTime', 1)" class="w-14 h-11 flex items-center justify-center rounded-lg bg-slate-800 text-slate-300 hover:text-white active:bg-slate-700 text-sm font-bold border border-slate-700 shadow-sm"><i class="fa-solid fa-plus mr-1"></i>30分</button>
        </div>
      </div>

      <div class="bg-slate-800/40 rounded-xl p-3 border border-slate-800 space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-slate-300">下班打卡時間</label>
          <button type="button" onclick="setEndTimeNow()" class="px-3 py-1 rounded bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs flex items-center gap-1 shadow"><i class="fa-solid fa-bolt"></i> 帶入現在</button>
        </div>
        <div class="flex items-center space-x-2 bg-slate-900 rounded-xl p-1 border border-slate-700">
          <button type="button" onclick="stepTime('inputEndTime', -1)" class="w-14 h-11 flex items-center justify-center rounded-lg bg-slate-800 text-slate-300 hover:text-white active:bg-slate-700 text-sm font-bold border border-slate-700 shadow-sm"><i class="fa-solid fa-minus mr-1"></i>30分</button>
          <select id="inputEndTime" onchange="calculatePreview()" class="flex-1 bg-transparent text-2xl font-black text-white text-center focus:outline-none"></select>
          <button type="button" onclick="stepTime('inputEndTime', 1)" class="w-14 h-11 flex items-center justify-center rounded-lg bg-slate-800 text-slate-300 hover:text-white active:bg-slate-700 text-sm font-bold border border-slate-700 shadow-sm"><i class="fa-solid fa-plus mr-1"></i>30分</button>
        </div>
      </div>

      <div class="bg-slate-950/80 rounded-xl p-3 border border-slate-800 flex justify-between items-center">
        <div>
          <span class="text-[11px] text-slate-400 block mb-0.5">本次實際工時</span>
          <span class="text-[11px] text-slate-500 font-medium" id="calcActualText">--</span>
        </div>
        <div class="text-right">
          <span class="text-2xl font-black text-amber-400" id="previewActual">0.0</span> <span class="text-xs text-amber-500/70">h</span>
        </div>
      </div>

      <button onclick="saveRecord()" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-[0.99] transition text-slate-950 font-black text-base shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
        <i class="fa-solid fa-check"></i>
        <span>下班確認儲存</span>
      </button>
    </div>

    <!-- 折疊區 2：歷史紀錄與匯出 -->
    <details class="group bg-slate-900 border border-slate-700 rounded-2xl shadow-lg overflow-hidden" open>
      <summary class="flex justify-between items-center font-bold cursor-pointer list-none p-4 text-sm text-slate-200 bg-slate-800/50 hover:bg-slate-800 transition">
        <span class="flex items-center gap-2"><i class="fa-solid fa-list-check text-amber-400"></i> <span id="historyTitle">展開每日打卡紀錄</span></span>
        <span class="transition-transform duration-300 group-open:rotate-180"><i class="fa-solid fa-chevron-down"></i></span>
      </summary>
      
      <div class="p-3 border-t border-slate-700 space-y-3">
        <!-- 匯出按鈕區 -->
        <div class="flex space-x-2 justify-end">
          <button onclick="copyMonthSummary()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold border border-slate-600 flex items-center gap-1.5">
            <i class="fa-regular fa-copy text-amber-400"></i> 複製對帳單
          </button>
          <button onclick="exportCSV()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold border border-slate-600 flex items-center gap-1.5">
            <i class="fa-solid fa-file-csv text-emerald-400"></i> 匯出CSV
          </button>
        </div>
        
        <!-- 每日紀錄列表 -->
        <div id="recordsList" class="space-y-2"></div>
      </div>
    </details>
  </main>

  <!-- 身分設定 Modal -->
  <div id="profileModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i class="fa-solid fa-id-card text-amber-400"></i> 設定個人資料與系統
        </h3>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="text-xs text-slate-300 block mb-1">司機姓名 / 車號</label>
          <input type="text" id="profileNameInput" placeholder="例如：阿舜、劉司機" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
        
        <!-- 新增：重置按鈕 -->
        <div class="pt-4 border-t border-slate-800">
          <button onclick="factoryReset()" class="w-full py-2 rounded-xl bg-rose-950/50 hover:bg-rose-900 border border-rose-800 text-rose-400 font-bold text-xs flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-triangle-exclamation"></i> 刪除所有紀錄 (重置系統)
          </button>
          <p class="text-[10px] text-slate-500 mt-1 text-center">如果您看不到舊資料或計算錯誤，請點此清除重來</p>
        </div>
      </div>

      <div class="pt-2 flex space-x-2 mt-2 border-t border-slate-800 pt-3">
        <button onclick="closeProfileModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-sm font-semibold">取消</button>
        <button onclick="saveProfile()" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_RECORDS = 'kezhixinj_driver_records_web'; 
    const STORAGE_KEY_DEFAULT_START = 'kezhixinj_default_start_web';
    const STORAGE_KEY_PROFILE = 'kezhixinj_driver_profile_web';

    let records = [];
    let defaultStartTime = '06:30';
    let profile = { name: '' };
    let currentAutoType = 'weekday';

    window.addEventListener('DOMContentLoaded', () => {
      generateTimeSelectOptions();
      loadStorage();
      initToday();
    });

    // 清除所有資料的救援函式
    function factoryReset() {
      if(confirm("⚠️ 警告：這將會刪除您手機內「所有」的打卡紀錄與設定！\n確定要全部清空重來嗎？")) {
        localStorage.clear(); // 直接清空這個網址所有的本地資料
        records = [];
        alert("已全部清空！幫您重新整理網頁。");
        location.reload();
      }
    }

    function generateTimeSelectOptions() {
      let optionsHTML = '';
      for (let h = 0; h < 24; h++) {
        let hh = String(h).padStart(2, '0');
        optionsHTML += `<option value="${hh}:00">${hh}:00</option>`;
        optionsHTML += `<option value="${hh}:30">${hh}:30</option>`;
      }
      document.getElementById('inputStartTime').innerHTML = optionsHTML;
      document.getElementById('inputEndTime').innerHTML = optionsHTML;
    }

    function stepTime(elementId, step) {
      const select = document.getElementById(elementId);
      let newIndex = select.selectedIndex + step;
      if (newIndex < 0) newIndex = 0;
      if (newIndex >= select.options.length) newIndex = select.options.length - 1;
      select.selectedIndex = newIndex;
      calculatePreview();
    }

    function normalizeDate(rawDate) {
      if (!rawDate) return '';
      let s = String(rawDate).trim().replace(/\//g, '-');
      let parts = s.split('-');
      if (parts.length === 3) {
        let y = parts[0];
        let m = parts[1].padStart(2, '0');
        let d = parts[2].padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      return s;
    }

    function loadStorage() {
      try {
        const storedProfile = localStorage.getItem(STORAGE_KEY_PROFILE);
        if (storedProfile) profile = JSON.parse(storedProfile);
        updateProfileDisplay();

        const storedDefault = localStorage.getItem(STORAGE_KEY_DEFAULT_START);
        if (storedDefault) defaultStartTime = storedDefault;
        document.getElementById('inputStartTime').value = defaultStartTime;

        let allSources = [
          localStorage.getItem('kezhixinj_driver_records_web'),
          localStorage.getItem('kezhixinj_driver_records_v3'),
          localStorage.getItem('kezhixinj_driver_records_pwa'),
          localStorage.getItem('kezhixinj_driver_records_v1')
        ];

        let mergedMap = new Map();
        allSources.forEach(srcStr => {
          if (srcStr) {
            try {
              let arr = JSON.parse(srcStr);
              if (Array.isArray(arr)) {
                arr.forEach(item => {
                  if (item && item.date) {
                    item.date = normalizeDate(item.date);
                    let key = item.date;
                    if (!mergedMap.has(key)) {
                      mergedMap.set(key, item);
                    }
                  }
                });
              }
            } catch (err) {}
          }
        });

        records = Array.from(mergedMap.values());
        records.sort((a, b) => new Date(b.date) - new Date(a.date));
        localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
      } catch (e) {
        console.error('loadStorage 錯誤:', e);
      }
    }

    function updateProfileDisplay() {
      const label = document.getElementById('driverProfileLabel');
      label.textContent = profile.name && profile.name.trim() !== '' ? `司機：${profile.name}` : `本機專用（尚未設定）`;
    }

    function initToday() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      
      document.getElementById('inputDate').value = `${yyyy}-${mm}-${dd}`;
      document.getElementById('monthSelector').value = `${yyyy}-${mm}`;
      
      setEndTimeNow();
      onDateChanged();
      onMonthChanged();
    }

    function onDateChanged() {
      const dateVal = document.getElementById('inputDate').value;
      if (!dateVal) return;

      const dateObj = new Date(dateVal + 'T00:00:00');
      const day = dateObj.getDay();
      const daysMap = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('weekdayNameDisplay').textContent = daysMap[day];

      const badge = document.getElementById('autoTypeBadge');
      if (day === 6 || day === 0) {
        currentAutoType = 'weekend';
        badge.innerHTML = '<span class="text-emerald-400">假日 (六/日)</span>';
        badge.className = "w-full bg-emerald-900/30 border border-emerald-800 rounded-xl px-2.5 py-2 text-sm text-center font-bold";
      } else {
        currentAutoType = 'weekday';
        badge.innerHTML = '<span class="text-sky-400">平日</span>';
        badge.className = "w-full bg-sky-900/30 border border-sky-800 rounded-xl px-2.5 py-2 text-sm text-center font-bold";
      }
      
      document.getElementById('isHolidayCheck').checked = false;
      calculatePreview();
    }

    function onMonthChanged() {
      renderStats();
      renderList();
    }

    function setEndTimeNow() {
      const now = new Date();
      let hh = now.getHours();
      let min = now.getMinutes();
      
      if (min < 15) min = 0;
      else if (min >= 15 && min < 45) min = 30;
      else { min = 0; hh = (hh + 1) % 24; }

      const timeStr = String(hh).padStart(2, '0') + ':' + String(min).padStart(2, '0');
      document.getElementById('inputEndTime').value = timeStr;
      calculatePreview();
    }

    function timeToMinutes(t) {
      if (!t || typeof t !== 'string' || t.length < 4) return 0;
      const parts = t.split(':');
      if (parts.length !== 2) return 0;
      return (Number(parts[0]) || 0) * 60 + (Number(parts[1]) || 0);
    }

    function computeRecordHours(type, start, end) {
      const sMin = timeToMinutes(start);
      let eMin = timeToMinutes(end);
      if (eMin <= sMin) eMin += 24 * 60; 
      const totalWorkedMin = eMin - sMin;

      let actualHours = 0, weightedHours = 0;
      let h1_33 = 0, h1_67 = 0, h2_67 = 0, h1_5 = 0;
      let actualDetail = '', weightedDetail = '';

      if (type === 'holiday') {
        actualHours = Math.max(0, totalWorkedMin - 30) / 60; 
        h1_5 = actualHours;
        weightedHours = actualHours * 1.5;
        actualDetail = `在廠扣除 0.5h`;
        weightedDetail = `全天 1.5 倍`;
      } 
      else if (type === 'weekend' || type === 'saturday') { 
        actualHours = Math.max(0, totalWorkedMin - 30) / 60;
        h1_33 = Math.min(2, actualHours); 
        h1_67 = Math.max(0, Math.min(6, actualHours - 2)); 
        h2_67 = Math.max(0, actualHours - 8); 
        weightedHours = (h1_33 * 1.33) + (h1_67 * 1.67) + (h2_67 * 2.67);
        actualDetail = `在廠扣除 0.5h`;
        let parts = [];
        if (h1_33 > 0) parts.push(`(${h1_33.toFixed(1)}×1.33)`);
        if (h1_67 > 0) parts.push(`(${h1_67.toFixed(1)}×1.67)`);
        if (h2_67 > 0) parts.push(`(${h2_67.toFixed(1)}×2.67)`);
        weightedDetail = parts.length ? parts.join(' + ') : '無加班';
      } 
      else { 
        let earlyMin = 0, lateMin = 0;
        const normalStart = 8 * 60;
        if (sMin < normalStart) earlyMin = normalStart - sMin;
        const normalEnd = 18 * 60;
        if (eMin > normalEnd) lateMin = eMin - normalEnd;

        let earlyH = Math.round((earlyMin / 60) * 10) / 10;
        let lateH = Math.round((lateMin / 60) * 10) / 10;
        actualHours = Math.round((earlyH + lateH) * 10) / 10;
        
        h1_33 = Math.min(2, actualHours); 
        h1_67 = Math.max(0, actualHours - 2); 
        weightedHours = (h1_33 * 1.33) + (h1_67 * 1.67);
        actualDetail = `早出 ${earlyH.toFixed(1)}h + 延後 ${lateH.toFixed(1)}h`;
        
        if (actualHours > 0) {
           let parts = [];
           if (h1_33 > 0) parts.push(`(${h1_33.toFixed(1)}×1.33)`);
           if (h1_67 > 0) parts.push(`(${h1_67.toFixed(1)}×1.67)`);
           weightedDetail = parts.join(' + ');
        } else {
           weightedDetail = '無加班時數';
        }
      }

      return { 
        actualHours: actualHours, 
        weightedHours: Math.round(weightedHours * 100) / 100,
        h1_33, h1_67, h2_67, h1_5, actualDetail, weightedDetail
      };
    }

    function calculatePreview() {
      const isHoliday = document.getElementById('isHolidayCheck').checked;
      const type = isHoliday ? 'holiday' : currentAutoType;
      const start = document.getElementById('inputStartTime').value;
      const end = document.getElementById('inputEndTime').value;

      const res = computeRecordHours(type, start, end);
      document.getElementById('previewActual').textContent = (res.actualHours || 0).toFixed(1);
      document.getElementById('calcActualText').textContent = res.actualDetail;
    }

    function saveRecord() {
      const rawDate = document.getElementById('inputDate').value;
      const date = normalizeDate(rawDate);
      const isHoliday = document.getElementById('isHolidayCheck').checked;
      const type = isHoliday ? 'holiday' : currentAutoType;
      const start = document.getElementById('inputStartTime').value;
      const end = document.getElementById('inputEndTime').value;

      if (!date) return alert('請確認日期');

      const res = computeRecordHours(type, start, end);
      const recordItem = { 
        id: Date.now(), 
        date: date, 
        type: type, 
        start: start, 
        end: end, 
        actualHours: res.actualHours, 
        weightedHours: res.weightedHours,
        h1_33: res.h1_33, 
        h1_67: res.h1_67, 
        h2_67: res.h2_67, 
        h1_5: res.h1_5,
        actualDetail: res.actualDetail, 
        weightedDetail: res.weightedDetail
      };

      const existingIndex = records.findIndex(r => normalizeDate(r.date) === date);
      if (existingIndex >= 0) {
        let oldH = records[existingIndex].actualHours ?? records[existingIndex].hours ?? 0;
        if (!confirm(`【${date}】已有紀錄 (實際 ${Number(oldH).toFixed(1)}h)，是否覆蓋更新？`)) return;
        records[existingIndex] = recordItem;
      } else {
        records.unshift(recordItem);
      }

      records.sort((a, b) => new Date(b.date) - new Date(a.date));
      localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
      localStorage.setItem(STORAGE_KEY_DEFAULT_START, start);

      const recordMonth = date.substring(0, 7);
      document.getElementById('monthSelector').value = recordMonth;
      onMonthChanged();
    }

    function deleteRecord(id) {
      if (confirm('確定要刪除這筆紀錄嗎？')) {
        records = records.filter(r => r.id !== id);
        localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
        onMonthChanged();
      }
    }

    function getSelectedMonthRecords() {
      const filterValue = document.getElementById('monthSelector').value; 
      if (!filterValue) return [];
      return records.filter(r => {
        let d = normalizeDate(r.date);
        return d.startsWith(filterValue);
      });
    }

    function renderStats() {
      let totalActual = 0;
      let act_weekday = 0, act_weekend = 0, act_holiday = 0;
      let sum_133 = 0, sum_167 = 0, sum_267 = 0, sum_15 = 0;
      
      const monthRecords = getSelectedMonthRecords();

      monthRecords.forEach(r => {
        let rec = r;
        if (r.h1_33 === undefined || r.actualHours === undefined) {
          rec = computeRecordHours(r.type, r.start, r.end);
        }

        let actH = Number(rec.actualHours) || 0;
        totalActual += actH;
        
        if (r.type === 'weekday') act_weekday += actH;
        else if (r.type === 'weekend' || r.type === 'saturday') act_weekend += actH;
        else if (r.type === 'holiday') act_holiday += actH;

        sum_133 += Number(rec.h1_33) || 0;
        sum_167 += Number(rec.h1_67) || 0;
        sum_267 += Number(rec.h2_67) || 0;
        sum_15 += Number(rec.h1_5) || 0;
      });

      document.getElementById('statTotalActualHours').textContent = totalActual.toFixed(1);
      document.getElementById('statActWeekday').textContent = act_weekday.toFixed(1);
      document.getElementById('statActWeekend').textContent = act_weekend.toFixed(1);
      document.getElementById('statActHoliday').textContent = act_holiday.toFixed(1);
      
      document.getElementById('statRate133').textContent = sum_133.toFixed(1);
      document.getElementById('statRate167').textContent = sum_167.toFixed(1);
      document.getElementById('statRate267').textContent = sum_267.toFixed(1);
      document.getElementById('statRate15').textContent = sum_15.toFixed(1);
      
      document.getElementById('historyTitle').textContent = `展開每日打卡紀錄 (${monthRecords.length} 筆)`;
    }

    function toggleCard(id) {
      const detailEl = document.getElementById(`card-detail-${id}`);
      const arrowEl = document.getElementById(`card-arrow-${id}`);
      if (detailEl.classList.contains('hidden')) {
        detailEl.classList.remove('hidden');
        arrowEl.classList.add('rotate-180');
      } else {
        detailEl.classList.add('hidden');
        arrowEl.classList.remove('rotate-180');
      }
    }

    function renderList() {
      const container = document.getElementById('recordsList');
      const monthRecords = getSelectedMonthRecords();

      if (monthRecords.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs bg-slate-900/50 rounded-xl border border-slate-800"><i class="fa-solid fa-clipboard-list text-2xl mb-1 text-slate-700 block"></i>該月份尚無紀錄</div>`;
        return;
      }
      
      container.innerHTML = monthRecords.map(r => {
        let typeBadge = r.type === 'weekday' ? '<span class="px-1.5 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800/60 text-[10px]">平日</span>' :
                        (r.type === 'weekend' || r.type === 'saturday') ? '<span class="px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800/60 text-[10px]">假日</span>' :
                        '<span class="px-1.5 py-0.5 rounded bg-rose-950 text-rose-400 border border-rose-800/60 text-[10px]">紅字</span>';
        
        let rec = (r.h1_33 !== undefined && r.actualHours !== undefined) ? r : computeRecordHours(r.type, r.start, r.end);
        let actualH = Number(rec.actualHours) || 0;
        let weightedH = Number(rec.weightedHours) || 0;
        let dateClean = normalizeDate(r.date);

        return `
          <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl overflow-hidden transition">
            <div onclick="toggleCard(${r.id})" class="p-3 flex justify-between items-center cursor-pointer select-none hover:bg-slate-800/80">
              <div>
                <div class="flex items-center gap-2 mb-1">
                  <span class="text-sm font-bold text-white">${dateClean.substring(5)}</span>
                  ${typeBadge}
                </div>
                <div class="text-xs text-slate-400 font-medium">${r.start} ~ ${r.end}</div>
              </div>
              <div class="flex items-center gap-4">
                <div class="text-right">
                  <span class="text-2xl font-black text-amber-400">${actualH.toFixed(1)}</span>
                  <span class="text-xs text-slate-400">h</span>
                </div>
                <div id="card-arrow-${r.id}" class="text-slate-500 transition-transform duration-300">
                  <i class="fa-solid fa-chevron-down text-sm"></i>
                </div>
              </div>
            </div>
            
            <div id="card-detail-${r.id}" class="hidden p-3 border-t border-slate-700/50 bg-slate-900/80 relative">
              <button onclick="deleteRecord(${r.id})" class="absolute right-3 top-3 text-slate-400 hover:text-rose-400 p-2 bg-slate-800 rounded-lg border border-slate-700">
                <i class="fa-solid fa-trash-can"></i> 刪除
              </button>
              <div class="space-y-1.5 pr-14 text-left">
                <p class="text-[11px] text-slate-400"><span class="text-slate-500 font-medium">實際工時：</span><br>${rec.actualDetail || '--'}</p>
                <p class="text-[11px] text-amber-500/80"><span class="text-amber-600/80 font-medium">倍率算式：</span><br>${rec.weightedDetail || '--'}</p>
                <p class="text-[11px] text-amber-400 font-bold"><span class="text-amber-600/80 font-medium">算薪時數：</span><br>${weightedH.toFixed(2)} h</p>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function copyMonthSummary() {
      const filterValue = document.getElementById('monthSelector').value; 
      const monthRecords = getSelectedMonthRecords();
      if (monthRecords.length === 0) return alert('該月份無紀錄可複製');
      
      let totalAct = 0, totalWei = 0;
      let sum133 = 0, sum167 = 0, sum267 = 0, sum15 = 0;
      let actWeek = 0, actEnd = 0, actHol = 0;

      let text = `【科治新技 運輸課】加班對帳單\n${profile.name ? '司機：' + profile.name + '\n' : ''}月份：${filterValue.replace('-','年')}月\n--------------------------\n`;
      
      monthRecords.forEach(r => { 
        let rec = (r.h1_33 !== undefined && r.actualHours !== undefined) ? r : computeRecordHours(r.type, r.start, r.end);
        let actH = Number(rec.actualHours) || 0;
        let weiH = Number(rec.weightedHours) || 0;
        totalAct += actH;
        totalWei += weiH;
        
        sum133 += Number(rec.h1_33) || 0; 
        sum167 += Number(rec.h1_67) || 0; 
        sum267 += Number(rec.h2_67) || 0; 
        sum15 += Number(rec.h1_5) || 0;

        if (r.type === 'weekday') actWeek += actH;
        else if (r.type === 'weekend' || r.type === 'saturday') actEnd += actH;
        else actHol += actH;
        
        const typeStr = r.type === 'weekday' ? '平日' : (r.type === 'weekend' || r.type === 'saturday') ? '假日' : '紅字';
        text += `${normalizeDate(r.date)}(${typeStr}) ${r.start}-${r.end} | 實際:${actH.toFixed(1)}h\n`;
      });
      
      text += `--------------------------\n`;
      text += `【實際在廠工時】\n平日:${actWeek.toFixed(1)}h | 假日:${actEnd.toFixed(1)}h | 紅字:${actHol.toFixed(1)}h\n`;
      text += `總計在廠：${totalAct.toFixed(1)} h\n\n`;
      text += `【算薪倍率統計 (核對用)】\n`;
      text += `1.33倍：${sum133.toFixed(1)} h\n1.67倍：${sum167.toFixed(1)} h\n2.67倍：${sum267.toFixed(1)} h\n紅字(1.5倍)：${sum15.toFixed(1)} h\n`;
      
      navigator.clipboard.writeText(text).then(() => alert('已複製對帳明細！')).catch(() => alert('複製失敗'));
    }

    function exportCSV() {
      const filterValue = document.getElementById('monthSelector').value; 
      const monthRecords = getSelectedMonthRecords();
      if (monthRecords.length === 0) return alert('該月份無紀錄可匯出');

      let csv = '\uFEFF日期,類型,上班時間,下班時間,實際工時(h),1.33時數,1.67時數,2.67時數,1.5時數,算薪倍率總和(h),備註算式\n';
      monthRecords.forEach(r => {
        let rec = (r.h1_33 !== undefined && r.actualHours !== undefined) ? r : computeRecordHours(r.type, r.start, r.end);
        let actH = Number(rec.actualHours) || 0;
        let weiH = Number(rec.weightedHours) || 0;
        const typeStr = r.type === 'weekday' ? '平日' : (r.type === 'weekend' || r.type === 'saturday') ? '假日' : '紅字';
        csv += `"${normalizeDate(r.date)}","${typeStr}","${r.start}","${r.end}","${actH.toFixed(1)}","${(Number(rec.h1_33)||0).toFixed(1)}","${(Number(rec.h1_67)||0).toFixed(1)}","${(Number(rec.h2_67)||0).toFixed(1)}","${(Number(rec.h1_5)||0).toFixed(1)}","${weiH.toFixed(2)}","${rec.weightedDetail || ''}"\n`;
      });
      
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      link.setAttribute('download', `科治新技_${filterValue}_加班對帳${profile.name ? '_' + profile.name : ''}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function openProfileModal() {
      document.getElementById('profileNameInput').value = profile.name || '';
      document.getElementById('profileModal').classList.remove('hidden');
    }
    function closeProfileModal() { 
      document.getElementById('profileModal').classList.add('hidden'); 
    }
    function saveProfile() {
      profile.name = document.getElementById('profileNameInput').value.trim();
      localStorage.setItem(STORAGE_KEY_PROFILE, JSON.stringify(profile));
      updateProfileDisplay();
      closeProfileModal();
    }
  </script>
