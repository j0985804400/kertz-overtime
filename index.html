<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>科治新技 運輸課加班速記</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="month"], input[type="date"], input[type="text"] {
      color-scheme: dark;
    }
    /* 隱藏原生下拉箭頭，讓選單看起來像純文字 */
    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      text-align: center;
    }
  </style>
</head>
<body class="min-h-screen pb-24 select-none">

  <!-- 頂部導航 -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2.5">
      <div class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold text-lg">
        <i class="fa-solid fa-truck-moving"></i>
      </div>
      <div>
        <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
          科治新技 <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30">網頁版</span>
        </h1>
        <p class="text-[11px] text-slate-400" id="driverProfileLabel">本機專用（尚未設定司機）</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="openProfileModal()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 border border-slate-700 flex items-center gap-1">
        <i class="fa-solid fa-user-pen text-amber-400"></i>
        <span>身分設定</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto px-3.5 py-4 space-y-4">
    
    <!-- 查詢與累計看板 -->
    <div class="bg-gradient-to-br from-slate-800/90 to-slate-900/90 border border-slate-700/60 rounded-2xl p-4 shadow-xl">
      <div class="flex items-center justify-between mb-3 border-b border-slate-700/50 pb-3">
        <span class="text-xs font-semibold text-slate-400 flex items-center gap-1.5">
          <i class="fa-solid fa-calendar-check text-amber-400"></i>
          <span>按月份查詢</span>
        </span>
        <input type="month" id="monthSelector" onchange="onMonthChanged()" class="bg-slate-800 border border-slate-600 rounded-lg px-2 py-1 text-sm text-amber-400 font-bold focus:outline-none focus:border-amber-400">
      </div>
      
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-baseline space-x-2">
          <span class="text-4xl font-black tracking-tight text-white" id="statTotalHours">0.0</span>
          <span class="text-sm font-semibold text-slate-400">小時 (h)</span>
        </div>
        <span class="text-[11px] px-2 py-0.5 rounded-full bg-amber-400/10 text-amber-400 border border-amber-400/20 font-bold" id="totalRecordsCount">0 筆</span>
      </div>

      <div class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-slate-700/50 text-center">
        <div class="bg-slate-800/60 rounded-xl py-2 px-1 border border-slate-700/40">
          <span class="text-[11px] text-slate-400 block mb-0.5">平日加班</span>
          <span class="text-base font-bold text-sky-400" id="statWeekdayHours">0.0</span>
          <span class="text-[10px] text-slate-500 block">h</span>
        </div>
        <div class="bg-slate-800/60 rounded-xl py-2 px-1 border border-slate-700/40">
          <span class="text-[11px] text-slate-400 block mb-0.5">假日(六/日)</span>
          <span class="text-base font-bold text-emerald-400" id="statWeekendHours">0.0</span>
          <span class="text-[10px] text-slate-500 block">-0.5h</span>
        </div>
        <div class="bg-slate-800/60 rounded-xl py-2 px-1 border border-slate-700/40">
          <span class="text-[11px] text-slate-400 block mb-0.5">國定紅字</span>
          <span class="text-base font-bold text-rose-400" id="statHolidayHours">0.0</span>
          <span class="text-[10px] text-slate-500 block">-0.5h</span>
        </div>
      </div>
    </div>

    <!-- 下班單次輸入卡片 -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <h2 class="text-sm font-bold text-slate-200 flex items-center gap-1.5">
          <i class="fa-solid fa-clock-rotate-left text-amber-400"></i> 下班打卡登記
        </h2>
        <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-amber-300 font-medium" id="weekdayNameDisplay">--</span>
      </div>

      <!-- 日期與自動判定 -->
      <div class="grid grid-cols-12 gap-3 items-center border-b border-slate-800/50 pb-3">
        <div class="col-span-7">
          <label class="text-[11px] text-slate-400 block mb-1 font-medium">日期</label>
          <input type="date" id="inputDate" onchange="onDateChanged()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
        <div class="col-span-5">
          <label class="text-[11px] text-slate-400 block mb-1 font-medium">系統自動判定</label>
          <div id="autoTypeBadge" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-sm text-center font-bold text-slate-300">--</div>
        </div>
        <div class="col-span-12 flex justify-end">
          <label class="flex items-center space-x-2 text-xs text-slate-400 bg-slate-800/50 px-2 py-1 rounded-lg border border-slate-700">
            <input type="checkbox" id="isHolidayCheck" onchange="calculatePreview()" class="w-3.5 h-3.5 accent-rose-500">
            <span>標記為國定紅字</span>
          </label>
        </div>
      </div>

      <!-- 上班時間設定 (半小時極速微調) -->
      <div class="bg-slate-800/40 rounded-xl p-3 border border-slate-800 space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-slate-300">上班出勤時間 (半小時制)</label>
          <span class="text-[11px] text-amber-400 flex items-center gap-1"><i class="fa-solid fa-rotate"></i> 自動記憶</span>
        </div>
        <div class="flex items-center space-x-2 bg-slate-900 rounded-xl p-1 border border-slate-700">
          <button type="button" onclick="stepTime('inputStartTime', -1)" class="w-14 h-11 flex items-center justify-center rounded-lg bg-slate-800 text-slate-300 hover:text-white active:bg-slate-700 text-sm font-bold border border-slate-700 shadow-sm">
            <i class="fa-solid fa-minus mr-1"></i>30分
          </button>
          
          <!-- 隱藏原生箭頭的 Select，點擊可快速開滾輪，不會叫出鍵盤 -->
          <select id="inputStartTime" onchange="calculatePreview()" class="flex-1 bg-transparent text-2xl font-black text-white text-center focus:outline-none">
            <!-- JS 自動產生 00:00 ~ 23:30 的選項 -->
          </select>

          <button type="button" onclick="stepTime('inputStartTime', 1)" class="w-14 h-11 flex items-center justify-center rounded-lg bg-slate-800 text-slate-300 hover:text-white active:bg-slate-700 text-sm font-bold border border-slate-700 shadow-sm">
            <i class="fa-solid fa-plus mr-1"></i>30分
          </button>
        </div>
      </div>

      <!-- 下班時間設定 (半小時極速微調) -->
      <div class="bg-slate-800/40 rounded-xl p-3 border border-slate-800 space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-semibold text-slate-300">下班打卡時間 (半小時制)</label>
          <button type="button" onclick="setEndTimeNow()" class="px-3 py-1 rounded bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs flex items-center gap-1 shadow">
            <i class="fa-solid fa-bolt"></i> 帶入現在
          </button>
        </div>
        <div class="flex items-center space-x-2 bg-slate-900 rounded-xl p-1 border border-slate-700">
          <button type="button" onclick="stepTime('inputEndTime', -1)" class="w-14 h-11 flex items-center justify-center rounded-lg bg-slate-800 text-slate-300 hover:text-white active:bg-slate-700 text-sm font-bold border border-slate-700 shadow-sm">
            <i class="fa-solid fa-minus mr-1"></i>30分
          </button>
          
          <select id="inputEndTime" onchange="calculatePreview()" class="flex-1 bg-transparent text-2xl font-black text-white text-center focus:outline-none">
            <!-- JS 自動產生 00:00 ~ 23:30 的選項 -->
          </select>

          <button type="button" onclick="stepTime('inputEndTime', 1)" class="w-14 h-11 flex items-center justify-center rounded-lg bg-slate-800 text-slate-300 hover:text-white active:bg-slate-700 text-sm font-bold border border-slate-700 shadow-sm">
            <i class="fa-solid fa-plus mr-1"></i>30分
          </button>
        </div>
      </div>

      <div class="bg-slate-950/80 rounded-xl p-3 border border-slate-800 flex items-center justify-between">
        <div>
          <span class="text-[11px] text-slate-400 block mb-0.5">本次試算工時</span>
          <span class="text-xs text-slate-300 font-medium" id="calcDetailText">--</span>
        </div>
        <div class="text-right">
          <span class="text-2xl font-black text-amber-400" id="previewHours">0.0</span>
          <span class="text-xs text-slate-400 font-semibold">小時</span>
        </div>
      </div>

      <button onclick="saveRecord()" class="w-full py-3.5 rounded-xl bg-amber-500 hover:bg-amber-400 active:scale-[0.99] transition text-slate-950 font-black text-base shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
        <i class="fa-solid fa-check"></i>
        <span>下班確認儲存</span>
      </button>
    </div>

    <!-- 歷史紀錄與匯出 -->
    <div class="space-y-3 pt-1">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">打卡紀錄清單</h3>
        <div class="flex space-x-1.5">
          <button onclick="copyMonthSummary()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700 flex items-center gap-1">
            <i class="fa-regular fa-copy text-amber-400"></i> 複製
          </button>
          <button onclick="exportCSV()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700 flex items-center gap-1">
            <i class="fa-solid fa-file-csv text-emerald-400"></i> 匯出
          </button>
        </div>
      </div>
      <div id="recordsList" class="space-y-2"></div>
    </div>
  </main>

  <!-- 身分設定 Modal -->
  <div id="profileModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i class="fa-solid fa-id-card text-amber-400"></i> 設定個人司機姓名
        </h3>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-300 block mb-1">司機姓名 / 車號</label>
          <input type="text" id="profileNameInput" placeholder="例如：阿舜、劉司機" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
        </div>
      </div>
      <div class="pt-2 flex space-x-2">
        <button onclick="closeProfileModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-sm font-semibold">取消</button>
        <button onclick="saveProfile()" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold text-sm">儲存設定</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_RECORDS = 'kezhixinj_driver_records_web';
    const STORAGE_KEY_DEFAULT_START = 'kezhixinj_default_start_web';
    const STORAGE_KEY_PROFILE = 'kezhixinj_driver_profile_web';

    let records = [];
    let defaultStartTime = '06:30';
    let profile = { name: '' };
    let currentAutoType = 'weekday';

    window.addEventListener('DOMContentLoaded', () => {
      generateTimeSelectOptions();
      loadStorage();
      initToday();
    });

    // 產生 00:00 ~ 23:30 的半小時選項
    function generateTimeSelectOptions() {
      let optionsHTML = '';
      for (let h = 0; h < 24; h++) {
        let hh = String(h).padStart(2, '0');
        optionsHTML += `<option value="${hh}:00">${hh}:00</option>`;
        optionsHTML += `<option value="${hh}:30">${hh}:30</option>`;
      }
      document.getElementById('inputStartTime').innerHTML = optionsHTML;
      document.getElementById('inputEndTime').innerHTML = optionsHTML;
    }

    // 增減 30 分鐘按鈕邏輯
    function stepTime(elementId, step) {
      const select = document.getElementById(elementId);
      let newIndex = select.selectedIndex + step;
      if (newIndex < 0) newIndex = 0; // 最早 00:00
      if (newIndex >= select.options.length) newIndex = select.options.length - 1; // 最晚 23:30
      select.selectedIndex = newIndex;
      calculatePreview();
    }

    function loadStorage() {
      try {
        const storedProfile = localStorage.getItem(STORAGE_KEY_PROFILE);
        if (storedProfile) profile = JSON.parse(storedProfile);
        updateProfileDisplay();

        const storedDefault = localStorage.getItem(STORAGE_KEY_DEFAULT_START);
        if (storedDefault) defaultStartTime = storedDefault;
        document.getElementById('inputStartTime').value = defaultStartTime;

        const storedRecords = localStorage.getItem(STORAGE_KEY_RECORDS);
        if (storedRecords) records = JSON.parse(storedRecords);
      } catch (e) { console.error(e); }
    }

    function updateProfileDisplay() {
      const label = document.getElementById('driverProfileLabel');
      label.textContent = profile.name && profile.name.trim() !== '' ? `司機：${profile.name}` : `本機專用（尚未設定）`;
    }

    function initToday() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      
      document.getElementById('inputDate').value = `${yyyy}-${mm}-${dd}`;
      document.getElementById('monthSelector').value = `${yyyy}-${mm}`;
      
      setEndTimeNow();
      onDateChanged();
      onMonthChanged();
    }

    function onDateChanged() {
      const dateVal = document.getElementById('inputDate').value;
      if (!dateVal) return;

      const dateObj = new Date(dateVal + 'T00:00:00');
      const day = dateObj.getDay();
      const daysMap = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      document.getElementById('weekdayNameDisplay').textContent = daysMap[day];

      const badge = document.getElementById('autoTypeBadge');
      if (day === 6 || day === 0) {
        currentAutoType = 'weekend';
        badge.innerHTML = '<span class="text-emerald-400">假日 (六/日)</span>';
        badge.className = "w-full bg-emerald-900/30 border border-emerald-800 rounded-xl px-2.5 py-2 text-sm text-center font-bold";
      } else {
        currentAutoType = 'weekday';
        badge.innerHTML = '<span class="text-sky-400">平日</span>';
        badge.className = "w-full bg-sky-900/30 border border-sky-800 rounded-xl px-2.5 py-2 text-sm text-center font-bold";
      }
      
      document.getElementById('isHolidayCheck').checked = false;
      calculatePreview();
    }

    function onMonthChanged() {
      renderStats();
      renderList();
    }

    // 智能獲取現在時間，並四捨五入到最近的 30 分鐘
    function setEndTimeNow() {
      const now = new Date();
      let hh = now.getHours();
      let min = now.getMinutes();
      
      if (min < 15) min = 0;
      else if (min >= 15 && min < 45) min = 30;
      else { min = 0; hh = (hh + 1) % 24; }

      const timeStr = String(hh).padStart(2, '0') + ':' + String(min).padStart(2, '0');
      document.getElementById('inputEndTime').value = timeStr;
      calculatePreview();
    }

    function timeToMinutes(t) {
      if (!t || t.length < 4) return 0;
      const parts = t.split(':');
      if (parts.length !== 2) return 0;
      return Number(parts[0]) * 60 + Number(parts[1]);
    }

    function computeRecordHours(type, start, end) {
      const sMin = timeToMinutes(start);
      let eMin = timeToMinutes(end);
      if (eMin < sMin) eMin += 24 * 60;
      const totalWorkedMin = eMin - sMin;

      if (type === 'weekend' || type === 'saturday' || type === 'holiday') {
        const netMin = Math.max(0, totalWorkedMin - 30);
        const hours = Math.round((netMin / 60) * 10) / 10;
        const labelStr = type === 'holiday' ? '國定紅字' : '假日(六/日)';
        return { total: hours, detail: `${labelStr}：在廠 ${(totalWorkedMin/60).toFixed(1)}h - 扣0.5h = ${hours}h` };
      } else {
        let earlyMin = 0, lateMin = 0;
        const normalStart = 8 * 60;
        if (sMin < normalStart) earlyMin = normalStart - sMin;
        const normalEnd = 18 * 60;
        if (eMin > normalEnd) lateMin = eMin - normalEnd;
        const earlyH = Math.round((earlyMin / 60) * 10) / 10;
        const lateH = Math.round((lateMin / 60) * 10) / 10;
        const total = Math.round((earlyH + lateH) * 10) / 10;
        return { total: total, detail: `平日加班：早出 ${earlyH}h + 延後 ${lateH}h` };
      }
    }

    function calculatePreview() {
      const isHoliday = document.getElementById('isHolidayCheck').checked;
      const type = isHoliday ? 'holiday' : currentAutoType;
      const start = document.getElementById('inputStartTime').value;
      const end = document.getElementById('inputEndTime').value;

      const res = computeRecordHours(type, start, end);
      document.getElementById('previewHours').textContent = res.total.toFixed(1);
      document.getElementById('calcDetailText').textContent = res.detail;
    }

    function saveRecord() {
      const date = document.getElementById('inputDate').value;
      const isHoliday = document.getElementById('isHolidayCheck').checked;
      const type = isHoliday ? 'holiday' : currentAutoType;
      const start = document.getElementById('inputStartTime').value;
      const end = document.getElementById('inputEndTime').value;

      if (!date) return alert('請確認日期');

      const res = computeRecordHours(type, start, end);
      const recordItem = { id: Date.now(), date, type, start, end, hours: res.total, detail: res.detail };

      const existingIndex = records.findIndex(r => r.date === date);
      if (existingIndex >= 0) {
        if (!confirm(`【${date}】已有打卡紀錄 (${records[existingIndex].hours}h)，是否覆蓋更新？`)) return;
        records[existingIndex] = recordItem;
      } else {
        records.unshift(recordItem);
      }

      records.sort((a, b) => new Date(b.date) - new Date(a.date));
      localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
      
      // 自動記住最後一次的上班時間
      localStorage.setItem(STORAGE_KEY_DEFAULT_START, start);

      const recordMonth = date.substring(0, 7);
      document.getElementById('monthSelector').value = recordMonth;
      onMonthChanged();
    }

    function deleteRecord(id) {
      if (confirm('確定要刪除這筆紀錄嗎？')) {
        records = records.filter(r => r.id !== id);
        localStorage.setItem(STORAGE_KEY_RECORDS, JSON.stringify(records));
        onMonthChanged();
      }
    }

    function renderStats() {
      let total = 0, weekday = 0, weekend = 0, holiday = 0;
      const filterValue = document.getElementById('monthSelector').value; 
      if (!filterValue) return;

      const monthRecords = records.filter(r => r.date.startsWith(filterValue));

      monthRecords.forEach(r => {
        total += r.hours;
        if (r.type === 'weekday') weekday += r.hours;
        else if (r.type === 'weekend' || r.type === 'saturday') weekend += r.hours;
        else if (r.type === 'holiday') holiday += r.hours;
      });

      document.getElementById('statTotalHours').textContent = total.toFixed(1);
      document.getElementById('statWeekdayHours').textContent = weekday.toFixed(1);
      document.getElementById('statWeekendHours').textContent = weekend.toFixed(1);
      document.getElementById('statHolidayHours').textContent = holiday.toFixed(1);
      document.getElementById('totalRecordsCount').textContent = `${monthRecords.length} 筆`;
    }

    function renderList() {
      const container = document.getElementById('recordsList');
      const filterValue = document.getElementById('monthSelector').value; 
      const monthRecords = records.filter(r => r.date.startsWith(filterValue));

      if (monthRecords.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs bg-slate-900/50 rounded-xl border border-slate-800"><i class="fa-solid fa-clipboard-list text-2xl mb-1 text-slate-600 block"></i>該月份尚無紀錄</div>`;
        return;
      }
      container.innerHTML = monthRecords.map(r => {
        let typeBadge = r.type === 'weekday' ? '<span class="px-1.5 py-0.5 rounded bg-sky-950 text-sky-400 border border-sky-800/60 text-[10px]">平日</span>' :
                        (r.type === 'weekend' || r.type === 'saturday') ? '<span class="px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800/60 text-[10px]">假日</span>' :
                        '<span class="px-1.5 py-0.5 rounded bg-rose-950 text-rose-400 border border-rose-800/60 text-[10px]">紅字</span>';
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
            <div>
              <div class="flex items-center space-x-2 mb-1">
                <span class="text-xs font-bold text-white">${r.date}</span>${typeBadge}
                <span class="text-[11px] text-slate-400">${r.start} ~ ${r.end}</span>
              </div>
              <p class="text-[11px] text-slate-400">${r.detail}</p>
            </div>
            <div class="flex items-center space-x-3">
              <span class="text-base font-black text-amber-400">${r.hours.toFixed(1)} <span class="text-xs font-normal text-slate-400">h</span></span>
              <button onclick="deleteRecord(${r.id})" class="text-slate-500 hover:text-rose-400 p-1.5"><i class="fa-regular fa-trash-can text-sm"></i></button>
            </div>
          </div>`;
      }).join('');
    }

    function copyMonthSummary() {
      const filterValue = document.getElementById('monthSelector').value; 
      const monthRecords = records.filter(r => r.date.startsWith(filterValue));
      if (monthRecords.length === 0) return alert('該月份無紀錄可複製');
      
      let total = 0, text = `【科治新技 運輸課】加班對帳單\n${profile.name ? '司機：' + profile.name + '\n' : ''}月份：${filterValue.replace('-','年')}月\n--------------------------\n`;
      monthRecords.forEach(r => { 
        total += r.hours; 
        const typeStr = r.type === 'weekday' ? '平日' : (r.type === 'weekend' || r.type === 'saturday') ? '假日' : '紅字';
        text += `${r.date} (${typeStr}) ${r.start}-${r.end} => ${r.hours}h\n`; 
      });
      text += `--------------------------\n總計工時：${total.toFixed(1)} h\n`;
      navigator.clipboard.writeText(text).then(() => alert('已複製！可貼到 LINE。')).catch(() => alert('複製失敗'));
    }

    function exportCSV() {
      const filterValue = document.getElementById('monthSelector').value; 
      const monthRecords = records.filter(r => r.date.startsWith(filterValue));
      if (monthRecords.length === 0) return alert('該月份無紀錄可匯出');

      let csv = '\uFEFF日期,類型,上班時間,下班時間,加班時數(h),說明\n';
      monthRecords.forEach(r => {
        const typeStr = r.type === 'weekday' ? '平日' : (r.type === 'weekend' || r.type === 'saturday') ? '假日' : '紅字';
        csv += `"${r.date}","${typeStr}","${r.start}","${r.end}","${r.hours}","${r.detail}"\n`;
      });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      link.setAttribute('download', `科治新技_${filterValue}_加班紀錄${profile.name ? '_' + profile.name : ''}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function openProfileModal() {
      document.getElementById('profileNameInput').value = profile.name || '';
      document.getElementById('profileModal').classList.remove('hidden');
    }
    function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }
    function saveProfile() {
      profile.name = document.getElementById('profileNameInput').value.trim();
      localStorage.setItem(STORAGE_KEY_PROFILE, JSON.stringify(profile));
      updateProfileDisplay();
      closeProfileModal();
    }
  </script>
</body>
</html>
